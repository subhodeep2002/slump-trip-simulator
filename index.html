<style>
/* layout: sticky transport bar, trip strip, live data band with raw feed, then three formula columns split by hairlines */
:root {
  --paper: #F5F5F1;
  --paper-2: #ECEDE7;
  --ink: #1C1F22;
  --ink-2: #555B61;
  --ink-3: #8B9095;
  --rule: #D8D9D2;
  --slump: #2C5AA0;
  --press: #C2661C;
  --good: #2F7A4D;
  --bad: #B03A2E;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 1560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 1.5px solid var(--slump); outline-offset: 2px; }
.k { color: var(--ink-3); }
.brand span, .trip .d, .trip .s, .f .src, .fin span, .ch .v, .ch .at { white-space: pre; }
.st { white-space: pre-wrap; }
.u { color: var(--ink-3); font-size: 11px; }

/* bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.bar-in { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand b { font-weight: 600; font-size: 14px; letter-spacing: 0.02em; }
.transport { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.tbtn { padding: 4px 10px; color: var(--ink-2); border-bottom: 1.5px solid transparent; }
.tbtn:hover { color: var(--ink); }
.tbtn.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.sep { width: 1px; height: 18px; background: var(--rule); margin: 0 8px; }
#play { min-width: 76px; text-align: left; color: var(--ink); font-weight: 600; }
.clock { margin-left: auto; display: flex; gap: 18px; align-items: baseline; }
#clk { font-size: 18px; font-weight: 500; letter-spacing: 0.02em; }

/* trips */
.trips { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); border-bottom: 1px solid var(--rule); max-height: 252px; overflow-y: auto; overscroll-behavior: contain; }
.trip { text-align: left; padding: 9px 10px 8px; border-top: 2px solid transparent; border-right: 1px solid var(--rule); display: grid; gap: 1px; }
.trip:hover { background: var(--paper-2); }
.trip.on { border-top-color: var(--ink); background: var(--paper-2); }
.trip .n { font-weight: 600; font-size: 13px; }
.trip .d, .trip .s { color: var(--ink-3); font-size: 10.5px; white-space: nowrap; }
.trip .flag { color: var(--press); white-space: normal; word-spacing: 2px; }
.trip { min-width: 0; }
.tgrp { grid-column: 1 / -1; padding: 7px 10px 5px; font-size: 10.5px; color: var(--ink-3); letter-spacing: .04em; border-top: 1px solid var(--rule); background: var(--paper-2); white-space: pre; position: sticky; top: 0; z-index: 1; }

/* meta */
.meta { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.meta div { padding: 8px 14px 8px 0; margin-right: 14px; border-right: 1px solid var(--rule); white-space: pre; }
.meta div:last-child { border-right: 0; }

/* live band */
.live { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); border-bottom: 1px solid var(--rule); }
.ch { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.ch > div { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); padding-left: 12px; min-width: 0; }
.ch > div:nth-child(4n+1) { padding-left: 0; }
.ch > div:nth-last-child(-n+4) { border-bottom: 0; }
.ch .v { font-size: 17px; font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; }
.ch .at { color: var(--ink-3); font-size: 10.5px; }
.feed { padding: 10px 0 10px 16px; min-width: 0; font-size: 11.5px; line-height: 1.6; height: 132px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.feed div { white-space: pre; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.feed div:last-child { color: var(--ink); }
.feed .ts { color: var(--ink-3); margin-right: 10px; }
.feed .m { color: var(--press); }
.feed .x { color: var(--bad); }

/* scrubber */
.scrub { display: flex; align-items: center; gap: 14px; padding-block: 10px; border-bottom: 1px solid var(--rule); }
.scrub input { flex: 1; min-width: 0; -webkit-appearance: none; appearance: none; height: 18px; background: transparent; }
.scrub input::-webkit-slider-runnable-track { height: 1px; background: var(--ink-3); }
.scrub input::-moz-range-track { height: 1px; background: var(--ink-3); }
.scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 14px; margin-top: -7px; background: var(--ink); border: 0; border-radius: 0; }
.scrub input::-moz-range-thumb { width: 9px; height: 14px; background: var(--ink); border: 0; border-radius: 0; }

/* modules */
.mods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mod { padding: 16px 18px 22px; border-left: 1px solid var(--rule); min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.mod:first-child { border-left: 0; padding-left: 0; }
.mod:last-child { padding-right: 0; }
.mh { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.mh .tag { font-weight: 600; font-size: 14px; }
.mh .nm { color: var(--ink-2); }
.eq { margin: 0; padding: 10px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-family: var(--mono); font-size: 12px; line-height: 1.7; white-space: pre-wrap; color: var(--ink); }
.eq .c { color: var(--ink-3); }
.inp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 18px; }
.f { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 8px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.f label { color: var(--ink-3); font-size: 11px; grid-column: 1 / -1; }
.f input { width: 100%; min-width: 0; font: inherit; font-size: 15px; font-weight: 500; color: var(--ink); background: transparent; border: 0; padding: 0; }
.f input:focus { outline: none; }
.f:focus-within { border-bottom-color: var(--ink); }
.f input.bad { color: var(--bad); }
.f .src { color: var(--ink-3); font-size: 10.5px; }
.f .src.def { color: var(--press); }
.cst { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink-2); font-size: 11.5px; }
.cst button { color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; margin-left: auto; }
.cst button:hover { color: var(--ink); }
.big { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.big .sv { font-size: 38px; font-weight: 500; color: var(--slump); letter-spacing: -0.01em; line-height: 1.1; }
.big .dv { color: var(--ink-2); }
.st { color: var(--ink-2); font-size: 11.5px; min-height: 18px; }
.st b { font-weight: 600; color: var(--ink); }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--rule); }
.kv > div { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--rule); min-width: 0; }
.kv > div + div { padding-left: 10px; }
.kv > div:nth-child(3n+1) { padding-left: 0; }
.kv > div:not(:nth-child(3n)) { border-right: 1px solid var(--rule); }
.kv .k { display: block; font-size: 10.5px; }
.kv .v { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.lg { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 11px; color: var(--ink-2); }
.lg i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.lg i.d { border-top-style: dashed; border-top-width: 1px; }
.cw { width: 100%; }
.cw svg { display: block; width: 100%; height: 236px; }
.fin { display: flex; flex-wrap: wrap; gap: 4px 18px; padding-top: 8px; border-top: 1px solid var(--rule); }
.fin .g { color: var(--good); font-weight: 600; }
.fin .b { color: var(--bad); font-weight: 600; }

@media (max-width: 1180px) {
  .mods { grid-template-columns: minmax(0, 1fr); }
  .mod, .mod:first-child, .mod:last-child { border-left: 0; padding-left: 0; padding-right: 0; border-top: 1px solid var(--rule); }
  .mod:first-child { border-top: 0; }
  .live { grid-template-columns: minmax(0, 1fr); }
  .feed { padding-left: 0; border-top: 1px solid var(--rule); }

@media (max-width: 640px) {

  .ch > div:nth-last-child(-n+4) { border-bottom: 1px solid var(--rule); }
  .ch > div:nth-last-child(-n+2) { border-bottom: 0; }
  .clock { margin-left: 0; width: 100%; }
  .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kv > div:nth-child(3n+1) { padding-left: 10px; }
  .kv > div:nth-child(2n+1) { padding-left: 0; }
  .kv > div:not(:nth-child(3n)) { border-right: 0; }
  .kv > div:nth-child(2n+1) { border-right: 1px solid var(--rule); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }

    if (r[2] !== null) p.push('cur ' + raw(r[2]));
    if (r[8] !== null) p.push('<span class="m">master ' + raw(r[8]) + '</span>');
    if (r[4] !== null) p.push('<span class="m">dose ' + raw(r[4]) + ' L</span>');
    if (r[5] !== null) p.push('dose_trip ' + raw(r[5]));
    if (r[6] !== null) p.push('<span class="m">dose_count ' + raw(r[6]) + '</span>');
    if (r[7] !== null) p.push('manual ' + raw(r[7]));
    if (r[9] !== null) p.push('pump ' + raw(r[9]));
    if (r[11] !== null && r[11] !== undefined) p.push('tank ' + raw(r[11]));
    if (r[12] !== null && r[12] !== undefined) p.push('<span class="m">event ' + r[12] + '</span>');
    if (r[13] !== null && r[13] !== undefined) p.push('<span class="m">total_trip ' + raw(r[13]) + '</span>');
    if (r[14] !== null && r[14] !== undefined) p.push('flowmeter ' + raw(r[14]));
    return '<div><span class="ts">' + clockMs(t.startMs + r[0]) + '</span>' + p.join('  ') + '</div>';
  }

  function draw(force) {
    var t = TR[S.k], idx = idxAt(S.T), changed = force || idx !== S.idx;
    var past = t.siteMs !== undefined && t.siteMs !== null && S.T >= t.siteMs;
    if (past !== S.past) { changed = true; S.past = past; }
    S.idx = idx;
    $('#clk').textContent = clock(t.startMs + S.T);
    $('#el').textContent = el(S.T) + ' / ' + el(S.dur);
    $('#scrub').value = S.T;
    $('#rowc').textContent = (idx + 1) + ' / ' + t.rows.length;
    if (changed) {
      var c = idx >= 0 ? S.lv[idx] : { at: {} };
      function age(key) { return c.at[key] === undefined ? ' ' : 'at ' + clock(t.startMs + c.at[key]); }
      $('#c-avg').textContent = raw(c.avg); $('#a-avg').textContent = age('avg');
      $('#c-cur').textContent = raw(c.cur); $('#a-cur').textContent = age('cur');
      $('#c-master').textContent = raw(c.master); $('#a-master').textContent = c.master === null || c.master === undefined ? (S.tM === null ? 'not in data' : 'pending') : age('master');
      $('#c-rpm').textContent = raw(c.rpm); $('#a-rpm').textContent = age('rpm');
      $('#c-dir').textContent = c.dir === null || c.dir === undefined ? (S.noDir ? 'not in data' : 'na') : (c.dir === -10 ? '-10 unload' : '+' + c.dir + ' transit');
      $('#c-dir').style.color = c.dir === -10 ? 'var(--bad)' : '';
      $('#a-dir').textContent = age('dir');
      $('#c-pump').textContent = raw(c.pump); $('#a-pump').textContent = age('pump');
      $('#c-dose').textContent = c.dose === null || c.dose === undefined ? 'none' : c.dose + ' L  x' + raw(c.dcount); $('#a-dose').textContent = age('dose');
      $('#c-row').textContent = (idx + 1) + ' / ' + t.rows.length; $('#a-row').textContent = idx >= 0 ? 'at ' + clockMs(t.startMs + t.rows[idx][0]) : ' ';
      var lines = []; for (var i = Math.max(0, idx - 7); i <= idx; i++) lines.push(feedLine(t.rows[i], t));
      $('#feed').innerHTML = lines.join('');
    }
    MODS.forEach(function (m) { drawMod(m, idx, changed); });
  }

  function stateAt(m, idx) {
    if (idx >= 0) return m.st[idx];
    return { phase: 'start', t: 0, P0: null, P: null, dP: null, pp: 0, tp: 0, S: m.vals.S0, I: m.st[0].I, KI: m.st[0].KI };
  }

  function status(m, s, idx) {
    var t = TR[S.k];
    if (m.id === 'f1') {
      if (s.phase === 'start' || s.phase === 'waiting') return '<b>waiting</b>  plant side mixing or no pressure';
      if (s.phase === 'reference') { var w = idx >= 0 ? Math.min(3, t.rows[idx][0] / 60000 - s.t0) : 0; return '<b>reference</b>  setting P0  ' + fx(w, 1) + ' / 3 min'; }
      if (s.phase === 'transit') return '<b>transit</b>  live';
      return '<b>unload</b>  value held';
    }
    if (s.phase === 'start') return '<b>start</b>';
    if (s.phase === 'no_master') return '<b>no master pressure in data</b>  ' + (m.id === 'f2' ? 'plant slump held' : 'time term only');
    if (s.phase === 'pre_master') return '<b>waiting for master</b>  ' + (m.id === 'f2' ? 'plant slump held' : 'time term only');
    if (s.phase === 'gate') return '<b>master set</b>  waiting for a 0 to 2 rpm reading';
    if (s.phase === 'live') return '<b>live</b>' + (s.used ? '  reading used' : '  reading skipped by gate');
    return '<b>unload</b>  value held';
  }

  // where the prediction is compared with the site cone test: its recorded time, else unload, else trace end
  function cmpPoint(m, t) {
    if (t.siteMs !== undefined && t.siteMs !== null) {
      var j = -1; t.rows.forEach(function (r, i) { if (r[0] <= t.siteMs) j = i; });
      return { fi: Math.max(0, j), at: 'at_site_test', ms: t.siteMs };
    }
    if (m.freeze !== null) return { fi: m.freeze, at: 'at_unload', ms: t.rows[m.freeze][0] };
    return { fi: m.st.length - 1, at: 'at_trace_end', ms: t.rows[m.st.length - 1][0] };
  }

  function drawMod(m, idx, changed) {
    var s = stateAt(m, idx), t = TR[S.k];
    if (changed) {
      document.getElementById(m.id + '-S').textContent = fx(s.S, 1);
      document.getElementById(m.id + '-d').textContent = sg(s.S - m.vals.S0, 1) + ' from plant';
      document.getElementById(m.id + '-st').innerHTML = status(m, s, idx);
      var kv = [
        [m.id === 'f1' ? 't_transit min' : 't min', fx(s.t, 1)],
        [m.id === 'f1' ? 'P0 bar' : 'P0 master bar', fx(s.P0, 2)],
        [m.id === 'f1' ? 'Pc bar' : 'P ema bar', fx(s.P, 2)],
        ['ΔP %', s.dP === null ? 'na' : sg(s.dP * 100, 2)],
        ['I_batch ' + m.iu, m.id === 'f1' ? fx(s.I, 2) : grp(s.I)],
        ['K/I_batch', fx(s.KI, 4)],
        ['pressure part mm', sg(s.pp, 2)],
        ['time part mm', m.id === 'f2' ? '0' : sg(s.tp, 2)],
        ['S_live mm', fx(s.S, 2)]
      ];
      document.getElementById(m.id + '-kv').innerHTML = kv.map(function (x) { return '<div><span class="k">' + x[0] + '</span><span class="v">' + x[1] + '</span></div>'; }).join('');
      // result against the site cone test
      var cp = cmpPoint(m, t), fi = cp.fi, at = cp.at;
      var fs = m.st[fi], fin = document.getElementById(m.id + '-fin');
      if (idx >= fi) {
        var diff = t.site !== null ? fs.S - t.site : null;
        if (S.T < cp.ms) { fin.innerHTML = '<span class="k">' + at + '</span><span class="k">pending  ' + clock(t.startMs + cp.ms) + '</span><span>site ' + fx(t.site, 1) + '</span>'; return chart(m, idx); }
        var cls = diff === null ? '' : Math.abs(diff) <= 10 ? 'g' : 'b';
        fin.innerHTML = '<span class="k">' + at + '</span><span>pred ' + fx(fs.S, 1) + '</span><span>site ' + (t.site !== null ? fx(t.site, 1) : 'na') + '</span>' +
          '<span class="' + cls + '">diff ' + (diff === null ? 'na' : sg(diff, 1)) + '</span>';
      } else {
        fin.innerHTML = '<span class="k">' + at + '</span><span class="k">pending  ' + clock(t.startMs + cp.ms) + '</span><span>site ' + (t.site !== null ? fx(t.site, 1) : 'na') + '</span>';
      }
    }
    chart(m, idx);
  }

  // ---------- chart ----------
  function chart(m, idx) {
    var svg = document.getElementById(m.id + '-svg'), t = TR[S.k];
    var W = Math.max(280, svg.clientWidth || 400), H = 236, L = 40, R = 44, TP = 14, B = 24;
    var iw = W - L - R, ih = H - TP - B, dur = Math.max(S.dur, 1);
    function X(ms) { return L + ms / dur * iw; }
    function YS(v) { return TP + (1 - (v - m.sAx.lo) / (m.sAx.hi - m.sAx.lo)) * ih; }
    function YP(v) { return TP + (1 - (v - m.pAx.lo) / (m.pAx.hi - m.pAx.lo)) * ih; }
    var o = [];
    o.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="var(--paper)"/>');
    // unload bands
    S.bands.forEach(function (b) { o.push('<rect x="' + X(b[0]).toFixed(1) + '" y="' + TP + '" width="' + Math.max(1, X(b[1]) - X(b[0])).toFixed(1) + '" height="' + ih + '" fill="var(--paper-2)"/>'); });
    // grid and slump ticks
    m.sAx.ticks.forEach(function (v) {
      var y = YS(v).toFixed(1);
      o.push('<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="var(--rule)" stroke-width="1"/>');
      o.push('<text x="' + (L - 6) + '" y="' + (+y + 3.5) + '" text-anchor="end" font-size="10" fill="var(--slump)">' + +v.toFixed(1) + '</text>');
    });
    m.pAx.ticks.forEach(function (v) {
      var y = YP(v); o.push('<text x="' + (W - R + 6) + '" y="' + (y + 3.5).toFixed(1) + '" font-size="10" fill="var(--press)">' + +v.toFixed(1) + '</text>');
    });
    // time ticks
    var stepMin = dur > 90 * 60000 ? 20 : dur > 45 * 60000 ? 10 : 5;
    for (var mm = 0; mm * 60000 <= dur; mm += stepMin) {
      var x = X(mm * 60000).toFixed(1);
      o.push('<line x1="' + x + '" x2="' + x + '" y1="' + (TP + ih) + '" y2="' + (TP + ih + 4) + '" stroke="var(--ink-3)" stroke-width="1"/>');
      o.push('<text x="' + x + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="var(--ink-3)">' + mm + '</text>');
    }
    o.push('<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end" font-size="10" fill="var(--ink-3)" dx="40">min</text>');
    o.push('<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (TP + ih) + '" y2="' + (TP + ih) + '" stroke="var(--ink-3)" stroke-width="1"/>');
    var T = S.T;
    // event markers
    if (m.id !== 'f1' && S.tM !== null && T >= S.tM) {
      var xm = X(S.tM).toFixed(1);
      o.push('<line x1="' + xm + '" x2="' + xm + '" y1="' + TP + '" y2="' + (TP + ih) + '" stroke="var(--press)" stroke-width="1" stroke-dasharray="2 3"/>');
      o.push('<text x="' + (+xm + 4) + '" y="' + (TP + 9) + '" font-size="9.5" fill="var(--press)">master</text>');
    }
    if (m.id === 'f1' && idx >= 0 && m.st[idx].t0 !== null && m.st[idx].t0 !== undefined) {
      var x0 = X(m.st[idx].t0 * 60000), x3 = X(Math.min(m.st[idx].t0 + 3, T / 60000) * 60000);
      o.push('<rect x="' + x0.toFixed(1) + '" y="' + TP + '" width="' + Math.max(1, x3 - x0).toFixed(1) + '" height="' + ih + '" fill="var(--press)" fill-opacity="0.07"/>');
      o.push('<text x="' + (x0 + 4).toFixed(1) + '" y="' + (TP + 9) + '" font-size="9.5" fill="var(--press)">P0 window</text>');
    }
    S.doses.forEach(function (d) {
      if (T >= d) { var xd = X(d).toFixed(1); o.push('<line x1="' + xd + '" x2="' + xd + '" y1="' + (TP + ih - 10) + '" y2="' + (TP + ih) + '" stroke="var(--ink)" stroke-width="1.5"/>'); o.push('<text x="' + (+xd + 3) + '" y="' + (TP + ih - 3) + '" font-size="9.5" fill="var(--ink)">dose</text>'); }
    });
    // pressure readings
    t.rows.forEach(function (r, i) {
      var p = pval(m, r); if (p === null) return;
      var past = i <= idx, used = m.id === 'f1' ? (m.st[i].phase === 'reference' || m.st[i].phase === 'transit') && m.st[i].tl === r[0] / 60000 : m.st[i].used;
      if (!past) { o.push('<circle cx="' + X(r[0]).toFixed(1) + '" cy="' + YP(p).toFixed(1) + '" r="1.6" fill="var(--press)" fill-opacity="0.13"/>'); return; }
      o.push(used ? '<circle cx="' + X(r[0]).toFixed(1) + '" cy="' + YP(p).toFixed(1) + '" r="2.3" fill="var(--press)"/>'
                  : '<circle cx="' + X(r[0]).toFixed(1) + '" cy="' + YP(p).toFixed(1) + '" r="2.1" fill="var(--paper)" stroke="var(--press)" stroke-width="1" stroke-opacity="0.6"/>');
    });
    // P0 line
    var s = idx >= 0 ? m.st[idx] : null;
    if (s && s.P0 !== null && isFinite(s.P0)) {
      var from = m.id === 'f1' ? (s.t0 + 3) * 60000 : S.tM;
      if (m.id === 'f1') { for (var q = 0; q <= idx; q++) if (m.st[q].P0 !== null) { from = t.rows[q][0]; break; } }
      if (T >= from) {
        var yp0 = YP(s.P0).toFixed(1);
        o.push('<line x1="' + X(from).toFixed(1) + '" x2="' + X(T).toFixed(1) + '" y1="' + yp0 + '" y2="' + yp0 + '" stroke="var(--press)" stroke-width="1" stroke-dasharray="5 4"/>');
      }
    }
    // formula pressure line
    var pp = [];
    for (var i = 0; i <= idx; i++) {
      var st = m.st[i], r = t.rows[i];
      var upd = m.id === 'f1' ? (st.P !== null && st.tl === r[0] / 60000) : st.used;
      if (upd && st.P !== null) pp.push(X(r[0]).toFixed(1) + ',' + YP(st.P).toFixed(1));
    }
    if (pp.length > 1) o.push('<polyline points="' + pp.join(' ') + '" fill="none" stroke="var(--press)" stroke-width="1.6" stroke-linejoin="round"/>');
    // slump line, step after each reading
    var sp = [X(0).toFixed(1) + ',' + YS(m.vals.S0).toFixed(1)], prev = m.vals.S0;
    for (var j = 0; j <= idx; j++) {
      var sj = m.st[j].S, xj = X(t.rows[j][0]).toFixed(1);
      sp.push(xj + ',' + YS(prev).toFixed(1)); sp.push(xj + ',' + YS(sj).toFixed(1)); prev = sj;
    }
    sp.push(X(T).toFixed(1) + ',' + YS(prev).toFixed(1));
    o.push('<polyline points="' + sp.join(' ') + '" fill="none" stroke="var(--slump)" stroke-width="2" stroke-linejoin="round"/>');
    o.push('<circle cx="' + X(0).toFixed(1) + '" cy="' + YS(m.vals.S0).toFixed(1) + '" r="3" fill="var(--slump)"/>');
    o.push('<circle cx="' + X(T).toFixed(1) + '" cy="' + YS(prev).toFixed(1) + '" r="3.2" fill="var(--slump)"/>');
    // site cone test at the point the value is held
    var cpc = cmpPoint(m, t), fi = cpc.fi;
    if (t.site !== null && idx >= fi && T >= cpc.ms) {
      var xs = X(cpc.ms), ys = YS(t.site);
      o.push('<circle cx="' + xs.toFixed(1) + '" cy="' + ys.toFixed(1) + '" r="4.5" fill="var(--paper)" stroke="var(--slump)" stroke-width="1.5"/>');
      o.push('<text x="' + (xs - 7).toFixed(1) + '" y="' + (ys - 7).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="var(--slump)">site ' + +t.site.toFixed(1) + '</text>');
    }
    // cursor
    var xc = X(T).toFixed(1);
    o.push('<line x1="' + xc + '" x2="' + xc + '" y1="' + TP + '" y2="' + (TP + ih) + '" stroke="var(--ink)" stroke-width="1" stroke-opacity="0.55"/>');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('font-family', 'JetBrains Mono, ui-monospace, Menlo, monospace');
    svg.innerHTML = o.join('');
  }

  // ---------- loop and controls ----------
  function tick(now) {
    if (S.lastFrame === null) S.lastFrame = now;
    var dt = Math.min(250, now - S.lastFrame); S.lastFrame = now;
    if (S.playing) {
      S.T = Math.min(S.dur, S.T + dt * S.speed);
      if (S.T >= S.dur) { S.playing = false; paintPlay(); }
      draw(false);
    }
    requestAnimationFrame(tick);
  }
  $('#play').onclick = function () { if (!S.playing && S.T >= S.dur) S.T = 0; S.playing = !S.playing; paintPlay(); draw(true); };
  $('#restart').onclick = function () { S.T = 0; S.playing = true; paintPlay(); draw(true); };
  $('#end').onclick = function () { S.T = S.dur; S.playing = false; paintPlay(); draw(true); };
  $('#scrub').addEventListener('input', function (e) { S.T = Number(e.target.value); draw(true); });
  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    var rows = TR[S.k].rows;
    if (e.code === 'Space') { e.preventDefault(); $('#play').click(); }
    else if (e.key === 'ArrowRight') { var i = Math.min(rows.length - 1, idxAt(S.T) + 1); S.T = rows[i][0]; S.playing = false; paintPlay(); draw(true); }
    else if (e.key === 'ArrowLeft') { var j = Math.max(0, idxAt(S.T) - 1); S.T = rows[j][0]; S.playing = false; paintPlay(); draw(true); }
  });
  if (window.ResizeObserver) new ResizeObserver(function () { draw(true); }).observe(modsEl);

  paintSpeeds();
  loadTrip(0);
  requestAnimationFrame(tick);
})();
</script>

</body>
</html>
